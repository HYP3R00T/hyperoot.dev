[tools]
github-cli = "latest"
node = "lts"
pnpm = "latest"
prek = "latest"
rumdl = "latest"
uv = "latest"

[settings]
experimental = true
lockfile = true

[hooks]
enter = { run = "bash ./scripts/enter_project.sh", run_windows = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/enter_project.ps1" }

[env]
_.file = ".env"  # for sensitive data
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.dev]
description = "Dev Mode"
run = "astro dev --host 0.0.0.0"

[tasks.dicon]
description = "Downloads an SVG from svgrepo and saves it to src/assets/icons/"
run = "bash ./scripts/download-icon.sh"

[tasks.biome]
description = "Run Biome checks and apply safe fixes"
run = "biome check --write . && biome format --write ."
